MitreID: T1562.001
Category: vulnerable driver

Commands:
  Command: 'sc.exe create aswbidsh binPath=C:\Windows\Temp\aswbidsh.sys type=kernel && sc.exe start aswbidsh'
  Description: >-
    Gen Digital's Microsoft-signed aswbidsh.sys exposes process-control
    operations through IOCTL 0x5356E404 on \\.\AvAswIDSErHr. An
    Administrator or LocalSystem caller can submit a 0x20-byte request with
    command 2, operation 1, a caller-selected PID, and process_identity 0.
    Static analysis confirms that the direct PID path opens the target with
    ZwOpenProcess and calls ZwTerminateProcess. Setting flags bit 0 first
    clears ProcessBreakOnTermination. Dynamic validation confirmed termination
    of a harmless caller-selected process. The device is restricted to
    Administrators and LocalSystem, so this is not a low-privilege LPE, but it
    is usable as a BYOVD/EDR-killer primitive after administrator execution.
    The same dispatcher also exposes process suspension and critical-process
    flag clearing.
  Usecase: >-
    Terminate or suspend caller-selected processes from kernel mode to impair
    security tools.
  Privileges: >-
    Administrator or LocalSystem access is required; administrator privileges
    are also required to install and load the driver.
  OperatingSystem: Windows 10 and Windows 11 x64

